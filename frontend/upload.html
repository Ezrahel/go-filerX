<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload to FilerX</title>
    <link rel="stylesheet" href="/static/upload.css">
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="site-header">
        <a class="brand" href="/" aria-label="FilerX home">
            <span class="brand-mark">Fx</span>
            <span>FilerX</span>
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
            <a href="/listpdf">Library</a>
            <a href="/register">Create account</a>
            <a class="nav-pill" href="/login">Sign in</a>
        </nav>
    </header>

    <main class="shell compact-shell">
        <section class="upload-card" id="upload-panel" aria-labelledby="upload-title">
            <div class="card-header">
                <span class="card-kicker">Upload</span>
                <h1 id="upload-title">Share a document</h1>
                <p>Choose a useful file and add it to the open FilerX library.</p>
            </div>

            <form action="/create" method="POST" enctype="multipart/form-data" class="upload-form">
                <label for="title">Document title</label>
                <input type="text" id="title" name="title" placeholder="Document title" required>

                <label for="author">Author or source</label>
                <input type="text" id="author" name="author" placeholder="Author or source" required>

                <label for="pdffile">Choose file</label>
                <label class="file-drop" for="pdffile">
                    <span class="file-icon">⇧</span>
                    <span>
                        <strong>Select your document</strong>
                        <small>PDF, DOCX, PPTX, XLSX, TXT, or ODT</small>
                    </span>
                </label>
                <input class="visually-hidden" type="file" id="pdffile" name="pdffile" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.odt" required>

                <button class="button button-primary upload-submit" type="submit">Publish document</button>
            </form>
        </section>
    </main>
</body>
</html>
